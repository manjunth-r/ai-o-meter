<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Small Promo Tile (440x280)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 440px;
      height: 280px;
      background: #141414;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .card {
      width: 440px;
      height: 280px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      width: 28px;
      height: 28px;
      background: #FFF;
      color: #141414;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .hero-text h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 27px;
      line-height: 1.15;
      margin: 8px 0 6px;
      letter-spacing: -0.02em;
    }
    .hero-text p {
      font-size: 13px;
      color: #9C9C98;
      line-height: 1.4;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #202020;
      border: 1px solid #303030;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .dot-h { width: 10px; height: 10px; border-radius: 50%; background: #2E9E5B; box-shadow: 0 0 8px #2E9E5B; }
    .dot-m { width: 10px; height: 10px; border-radius: 50%; background: #D89A2C; }
    .dot-r { width: 10px; height: 10px; border-radius: 50%; background: #C2482C; }
    .tagline {
      font-size: 10.5px;
      font-weight: 600;
      color: #AAA;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-top">
      <div class="badge">AI</div>
      <div class="name">AI-o-Meter</div>
    </div>
    <div class="hero-text">
      <h1>Read with Confidence.</h1>
      <p>100% private, instant AI content likelihood meter for Chrome.</p>
    </div>
    <div class="bar">
      <div style="display: flex; gap: 8px;">
        <span class="dot-h"></span>
        <span class="dot-m"></span>
        <span class="dot-r"></span>
      </div>
      <span class="tagline">Client-Side · Real-Time</span>
    </div>
  </div>
</body>
</html>
